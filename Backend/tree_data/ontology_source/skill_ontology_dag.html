<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── top bar ── */
#topbar{background:#1c1c2e;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#topbar h1{font-size:13px;font-weight:600;white-space:nowrap}
#topbar .sep{color:#555;font-size:18px}
#stat{font-size:11px;color:#8a8aaa;white-space:nowrap}
#search{padding:5px 10px;border-radius:5px;border:1px solid #3a3a5c;background:#2a2a44;color:#ddd;font-size:11px;width:210px}
#search::placeholder{color:#666}
.tbtn{background:#2a2a44;border:1px solid #3a3a5c;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap}
.tbtn:hover{background:#3a3a5c}
#layout-label{font-size:10px;color:#666;white-space:nowrap}

/* ── layout ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── left sidebar ── */
#sidebar{width:260px;background:#fff;border-right:1px solid #e0e4ea;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
#sidebar-head{padding:10px 12px 6px;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
#legend{padding:6px 8px 8px;flex:1}

.subj-block{margin-bottom:4px}
.subj-head{display:flex;align-items:center;gap:6px;padding:6px 6px;cursor:pointer;user-select:none;border-radius:5px;font-size:11.5px;font-weight:700;color:#2a2a3a}
.subj-head:hover{background:#f5f7fa}
.subj-head.off{opacity:.35}
.subj-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.subj-n{font-size:10px;color:#aaa;margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500}
.subj-caret{font-size:9px;color:#999;width:14px;height:14px;display:flex;align-items:center;justify-content:center;transition:transform .15s;border-radius:3px}
.subj-caret:hover{background:#e6e9f0}
.subj-caret.collapsed{transform:rotate(-90deg)}
.subj-label{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.subj-topics{padding-left:6px}
.subj-topics.collapsed{display:none}

.leg-item{display:flex;align-items:center;gap:7px;padding:3.5px 6px;border-radius:5px;cursor:pointer;user-select:none;transition:background .15s}
.leg-item:hover{background:#f5f7fa}
.leg-item.off{opacity:.32}
.leg-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;border-width:1.5px;border-style:solid}
.leg-text{font-size:10.5px;color:#3a3a3a;line-height:1.3;flex:1}
.leg-n{font-size:9.5px;color:#aaa;margin-left:auto;font-variant-numeric:tabular-nums}
#filter-hint{font-size:10px;color:#bbb;padding:6px 10px 8px;line-height:1.5;border-top:1px solid #eee}

/* ── cy canvas ── */
#cy{flex:1;background:#fafbfc}

/* ── right detail panel ── */
#detail{width:280px;background:#fff;border-left:1px solid #e0e4ea;overflow-y:auto;flex-shrink:0;display:none;position:relative}
#det-inner{padding:14px 14px 20px}
#det-close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:18px;cursor:pointer;color:#bbb;line-height:1}
#det-close:hover{color:#555}
#det-id{font-size:15px;font-weight:700;color:#1c1c2e;margin-bottom:4px;word-break:break-word}
#det-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;display:inline-block;margin-bottom:6px;margin-right:4px;border-width:1px;border-style:solid}
#det-bloom{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;display:inline-block;margin-bottom:6px;border:1px solid #ccc;color:#666;background:#f5f5f5}
#det-sub{font-size:10px;color:#888;margin-bottom:8px;margin-top:2px}
#det-skill{font-size:12px;color:#333;line-height:1.65;margin-bottom:14px;padding:8px 10px;background:#f8f9fa;border-radius:6px;border-left:3px solid #ccc}
.det-sec{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.dep-list{list-style:none;margin-bottom:14px}
.dep-list li{font-size:11px;color:#444;padding:5px 8px;background:#f8f9fb;border-radius:4px;margin-bottom:3px;cursor:pointer;border-left:3px solid #ddd;line-height:1.4;transition:background .12s}
.dep-list li:hover{background:#eef2ff}
.dep-list li span.dep-id{font-weight:700;margin-right:4px}
.dep-empty{color:#bbb!important;cursor:default!important;border-left-color:#eee!important}

/* ── tooltip ── */
#tip{position:fixed;background:rgba(20,20,35,.9);color:#eee;padding:7px 11px;border-radius:6px;font-size:11px;max-width:280px;line-height:1.55;pointer-events:none;display:none;z-index:9999;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#tip strong{color:#fff;display:block;margin-bottom:2px}

/* ── mini scrollbar ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#f0f2f5}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* ── dark mode ── */
body.dark{background:#12131a}
body.dark #sidebar{background:#1a1b26;border-right-color:#2e2f45}
body.dark #sidebar-head{color:#8a8aaa;border-bottom-color:#2e2f45}
body.dark .subj-head{color:#dcdcf0}
body.dark .subj-head:hover{background:#22233a}
body.dark .subj-n{color:#555}
body.dark .subj-caret{color:#666}
body.dark .subj-caret:hover{background:#2a2b40}
body.dark .leg-text{color:#c0c0d8}
body.dark .leg-n{color:#555}
body.dark #filter-hint{color:#555;border-top-color:#2e2f45}
body.dark .leg-item:hover{background:#22233a}
body.dark #cy{background:#12131a}
body.dark #detail{background:#1a1b26;border-left-color:#2e2f45}
body.dark #det-id{color:#e0e0f0}
body.dark #det-sub{color:#666}
body.dark #det-bloom{background:#20212e;border-color:#3a3a5c;color:#9a9ac0}
body.dark #det-skill{background:#12131a;color:#c0c0d8;border-left-color:#3a3a5c}
body.dark .det-sec{color:#555}
body.dark .dep-list li{background:#12131a;color:#b0b0cc;border-left-color:#3a3a5c}
body.dark .dep-list li:hover{background:#1e1f30}
body.dark .dep-empty{color:#444!important}
body.dark #det-close{color:#555}
body.dark #det-close:hover{color:#aaa}
body.dark ::-webkit-scrollbar-track{background:#12131a}
body.dark ::-webkit-scrollbar-thumb{background:#3a3a5c}

/* ── dark toggle button ── */
#dark-btn{background:#2a2a44;border:1px solid #3a3a5c;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap;line-height:1}
#dark-btn:hover{background:#3a3a5c}
</style>

// ─────────────────────────────────────────────
// BUILD LEGEND (grouped by subject → topics)
// ─────────────────────────────────────────────
const legendRoot = document.getElementById('legend');
const hiddenTopics = new Set();
const hiddenSubjects = new Set();

function shortLabel(id){
  // break camel/underscore ids into two lines for compact node display
  return id.replace(/_/g, '_\n');
}

SUBJECT_ORDER.forEach(subj => {
  const topicKeys = SUBJECT_TOPIC_ORDER[subj] || [];
  const totalCount = topicKeys.reduce((acc,tk)=> acc + NODES.filter(n=>n.tp===tk).length, 0);
  const block = document.createElement('div');
  block.className = 'subj-block';

  const head = document.createElement('div');
  head.className = 'subj-head';
  head.id = 'head-' + subj;
  const firstTk = topicKeys[0];
  const swColor = firstTk && TOPIC_META[firstTk] ? TOPIC_META[firstTk].bd : '#999';

  const caret = document.createElement('span');
  caret.className = 'subj-caret';
  caret.id = 'caret-' + subj;
  caret.innerHTML = '&#9660;';

  const label = document.createElement('span');
  label.className = 'subj-label';
  label.innerHTML = `<span class="subj-swatch" style="background:${swColor}"></span>
    <span>${subj}</span>
    <span class="subj-n">${totalCount}</span>`;

  head.appendChild(caret);
  head.appendChild(label);
  block.appendChild(head);

  const topicsWrap = document.createElement('div');
  topicsWrap.className = 'subj-topics';
  topicsWrap.id = 'topics-' + subj;

  topicKeys.forEach(tk => {
    const meta = TOPIC_META[tk];
    if(!meta) return;
    const cnt = NODES.filter(n => n.tp === tk).length;
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.id = 'leg-' + tk;
    item.dataset.k = tk;
    item.dataset.subject = subj;
    item.innerHTML = `<span class="leg-dot" style="background:${meta.bg};border-color:${meta.bd}"></span>
      <span class="leg-text">${meta.label}</span>
      <span class="leg-n">${cnt}</span>`;
    item.onclick = () => toggleTopic(tk, item);
    topicsWrap.appendChild(item);
  });

  // Caret: collapse/expand the topic list only (does not touch graph visibility)
  caret.onclick = (e) => {
    e.stopPropagation();
    const collapsed = topicsWrap.classList.toggle('collapsed');
    caret.classList.toggle('collapsed', collapsed);
  };

  // Clicking the subject name/swatch/count: toggle ALL topics under this
  // subject on/off in the graph at once (independent of the other subjects).
  label.onclick = () => toggleSubjectVisibility(subj, head);

  block.appendChild(topicsWrap);
  legendRoot.appendChild(block);
});

function toggleSubjectVisibility(subj, headEl){
  const topics = SUBJECT_TOPIC_ORDER[subj] || [];
  const turningOff = !headEl.classList.contains('off');
  topics.forEach(tk => {
    if(turningOff) hiddenTopics.add(tk); else hiddenTopics.delete(tk);
    const item = document.getElementById('leg-' + tk);
    if(item) item.classList.toggle('off', turningOff);
  });
  headEl.classList.toggle('off', turningOff);
  applyVisibility();
}

function updateSubjectHeadState(subj){
  const topics = SUBJECT_TOPIC_ORDER[subj] || [];
  const headEl = document.getElementById('head-' + subj);
  if(!headEl || topics.length === 0) return;
  const allOff = topics.every(tk => hiddenTopics.has(tk));
  headEl.classList.toggle('off', allOff);
}

// ─────────────────────────────────────────────
// BUILD CYTOSCAPE ELEMENTS
// ─────────────────────────────────────────────
const nodeMap = {};
NODES.forEach(n => { nodeMap[n.id] = n; });

const els = [];
NODES.forEach(n => {
  els.push({ data:{ id:n.id, label:shortLabel(n.id), tp:n.tp, sub:n.sub, subject:n.subject, full:n.full, bloom:n.bloom } });
});
EDGES.forEach(([s,t], i) => {
  if(!nodeMap[s] || !nodeMap[t]) return; // skip dangling refs, if any
  els.push({ data:{ id:'e'+i, source:s, target:t } });
});

// ─────────────────────────────────────────────
// INIT CYTOSCAPE
// ─────────────────────────────────────────────
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: els,
  style: [
    {
      selector: 'node',
      style: {
        'shape':'roundrectangle',
        'width': 108,
        'height': 42,
        'label':'data(label)',
        'text-valign':'center',
        'text-halign':'center',
        'font-size':'7.5px',
        'font-family':'-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif',
        'text-wrap':'wrap',
        'text-max-width':'98px',
        'border-width':1.4,
        'background-color': n => (TOPIC_META[n.data('tp')]||{}).bg || '#eee',
        'border-color':     n => (TOPIC_META[n.data('tp')]||{}).bd || '#999',
        'color':            n => (TOPIC_META[n.data('tp')]||{}).fg || '#333',
        'font-weight':500,
      }
    },
    {
      selector:'edge',
      style:{
        'width':1.1,
        'line-color':'#7a8bbd',
        'target-arrow-color':'#7a8bbd',
        'target-arrow-shape':'triangle',
        'curve-style':'bezier',
        'arrow-scale':0.75,
        'opacity':0.65,
      }
    },
    { selector:'node.hl',   style:{ 'border-width':3, 'border-color':'#1c1c2e', 'z-index':10 } },
    { selector:'node.sel',  style:{ 'border-width':3, 'border-color':'#e74c3c', 'z-index':20 } },
    { selector:'node.dim',  style:{ 'opacity':0.15 } },
    { selector:'edge.hl',   style:{ 'line-color':'#e74c3c','target-arrow-color':'#e74c3c','width':2.2,'opacity':1,'z-index':10 } },
    { selector:'edge.dim',  style:{ 'opacity':0.03 } },
  ],
  layout:{
    name:'dagre',
    rankDir:'TB',
    nodeSep:14,
    rankSep:60,
    edgeSep:6,
    padding:40,
    animate:false,
  },
  minZoom:0.03,
  maxZoom:5,
  wheelSensitivity:0.25,
});

// ─────────────────────────────────────────────
// SQUARE REPACK — dagre lays disconnected components out in one
// long horizontal row, which stretches the graph across the
// horizon. After the initial layout, regroup each connected
// component (each independent topic tree keeps its own internal
// hierarchy) into a roughly square shelf-packed grid instead.
// ─────────────────────────────────────────────
function repackComponentsSquare(){
  const comps = cy.elements().components();
  if(comps.length <= 1){ cy.fit(null,40); return; }

  const GAP = 70;
  const items = comps.map(c => {
    const bb = c.boundingBox();
    return { comp:c, bb, w:bb.w, h:bb.h };
  });

  const totalArea = items.reduce((a,it)=> a + (it.w+GAP)*(it.h+GAP), 0);
  const targetWidth = Math.sqrt(totalArea) * 1.05;

  // Sort tallest-first for tidier shelves (classic shelf-packing heuristic)
  items.sort((a,b)=> b.h - a.h);

  let x = 0, y = 0, shelfH = 0;
  items.forEach(it => {
    if(x > 0 && x + it.w > targetWidth){
      x = 0;
      y += shelfH + GAP;
      shelfH = 0;
    }
    const dx = x - it.bb.x1;
    const dy = y - it.bb.y1;
    it.comp.nodes().forEach(n => {
      const p = n.position();
      n.position({ x: p.x + dx, y: p.y + dy });
    });
    x += it.w + GAP;
    shelfH = Math.max(shelfH, it.h);
  });

  cy.fit(null, 40);
}

cy.one('layoutstop', repackComponentsSquare);

// ─────────────────────────────────────────────
// THEME TOGGLE
// ─────────────────────────────────────────────
let isDark = false;
function toggleDark() {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';

  const edgeCol  = isDark ? '#6e82d4' : '#7a8bbd';
  const hlCol    = isDark ? '#e0e0f0' : '#1c1c2e';

  cy.nodes().forEach(n => {
    const meta = TOPIC_META[n.data('tp')] || {};
    n.style({
      'background-color': isDark ? (meta.bgD || '#222') : (meta.bg || '#eee'),
      'border-color':     isDark ? (meta.bdD || '#666') : (meta.bd || '#999'),
      'color':            isDark ? (meta.fgD || '#ccc') : (meta.fg || '#333'),
    });
  });

  cy.edges().style({
    'line-color': edgeCol,
    'target-arrow-color': edgeCol,
  });

  cy.style()
    .selector('node.hl').style({ 'border-width':3, 'border-color': hlCol, 'z-index':10 })
    .selector('edge.hl').style({ 'line-color':'#e74c3c','target-arrow-color':'#e74c3c','width':2.2,'opacity':1,'z-index':10 })
    .update();

  document.querySelectorAll('.leg-item').forEach(el => {
    const k = el.dataset.k;
    const meta = TOPIC_META[k];
    if (!meta) return;
    el.querySelector('.leg-dot').style.background = isDark ? meta.bgD : meta.bg;
    el.querySelector('.leg-dot').style.borderColor = isDark ? meta.bdD : meta.bd;
  });
}

// ─────────────────────────────────────────────
// TOOLTIP
// ─────────────────────────────────────────────
const tip = document.getElementById('tip');
cy.on('mouseover','node', e => {
  const d = e.target.data();
  const meta = TOPIC_META[d.tp] || {};
  const bloomHtml = d.bloom ? `<span style="display:block;font-size:10px;color:#f0b070;margin-top:3px;">Bloom: ${d.bloom}</span>` : '';
  tip.innerHTML = `<strong>${d.id}</strong>
    <span style="display:block;font-size:10px;color:#aac4ff;margin-bottom:4px;font-style:italic;">${d.subject} &middot; ${meta.label || d.sub}</span>
    ${d.full}${bloomHtml}`;
  tip.style.display = 'block';
  moveTip(e.originalEvent);
});
cy.on('mousemove','node', e => moveTip(e.originalEvent));
cy.on('mouseout','node',  () => { tip.style.display='none'; });
function moveTip(ev){
  tip.style.left=(ev.clientX+14)+'px';
  tip.style.top=(ev.clientY+14)+'px';
}

// ─────────────────────────────────────────────
// SELECTION
// ─────────────────────────────────────────────
cy.on('tap','node', e => selectNode(e.target));
cy.on('tap', e => { if(e.target===cy){ clearSel(); closePanel(); } });

function selectNode(n){
  clearSel();
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');
  const nb = n.neighborhood();
  nb.nodes().removeClass('dim').addClass('hl');
  nb.edges().removeClass('dim').addClass('hl');
  n.removeClass('dim').addClass('sel');
  showPanel(n);
}

function clearSel(){
  cy.nodes().removeClass('dim hl sel');
  cy.edges().removeClass('dim hl');
}

// ─────────────────────────────────────────────
// DETAIL PANEL
// ─────────────────────────────────────────────
function showPanel(n){
  const id = n.id();
  const nd = nodeMap[id];
  if (!nd) return;
  const meta = TOPIC_META[nd.tp] || {};

  document.getElementById('det-id').textContent = id;

  const badge = document.getElementById('det-badge');
  badge.textContent = meta.label || nd.sub;
  badge.style.background = isDark ? meta.bgD : meta.bg;
  badge.style.color = isDark ? meta.fgD : meta.fg;
  badge.style.borderColor = isDark ? meta.bdD : meta.bd;

  const bloomEl = document.getElementById('det-bloom');
  if(nd.bloom){
    bloomEl.style.display = 'inline-block';
    bloomEl.textContent = 'Bloom: ' + nd.bloom;
  } else {
    bloomEl.style.display = 'none';
  }

  document.getElementById('det-sub').textContent = nd.subject;

  const sk = document.getElementById('det-skill');
  sk.textContent = nd.full;
  sk.style.borderLeftColor = isDark ? meta.bdD : meta.bd;

  // Prereqs
  const preList = document.getElementById('det-pre');
  preList.innerHTML = '';
  const ins = n.incomers('edge');
  if(ins.length === 0){
    preList.innerHTML = '<li class="dep-empty">None — root skill</li>';
  } else {
    ins.forEach(e => {
      const src = e.source();
      const snd = nodeMap[src.id()];
      if(!snd) return;
      const smeta = TOPIC_META[snd.tp] || {};
      const li = document.createElement('li');
      li.style.borderLeftColor = isDark ? smeta.bdD : (smeta.bd || '#ddd');
      li.innerHTML = `<span class="dep-id">${src.id()}</span>${snd.full.substring(0,68)}${snd.full.length>68?'…':''}`;
      li.onclick = () => selectNode(src);
      preList.appendChild(li);
    });
  }

  // Leads to
  const outList = document.getElementById('det-out');
  outList.innerHTML = '';
  const outs = n.outgoers('edge');
  if(outs.length === 0){
    outList.innerHTML = '<li class="dep-empty">None — terminal skill</li>';
  } else {
    outs.forEach(e => {
      const tgt = e.target();
      const tnd = nodeMap[tgt.id()];
      if(!tnd) return;
      const tmeta = TOPIC_META[tnd.tp] || {};
      const li = document.createElement('li');
      li.style.borderLeftColor = isDark ? tmeta.bdD : (tmeta.bd || '#ddd');
      li.innerHTML = `<span class="dep-id">${tgt.id()}</span>${tnd.full.substring(0,68)}${tnd.full.length>68?'…':''}`;
      li.onclick = () => selectNode(tgt);
      outList.appendChild(li);
    });
  }

  document.getElementById('detail').style.display = 'block';
}

function closePanel(){
  document.getElementById('detail').style.display = 'none';
  clearSel();
}

// ─────────────────────────────────────────────
// TOPIC / SUBJECT FILTER
// ─────────────────────────────────────────────
function applyVisibility(){
  cy.nodes().forEach(n => {
    const tk = n.data('tp');
    n.style('display', hiddenTopics.has(tk) ? 'none' : 'element');
  });
  cy.edges().forEach(e => {
    const vis = e.source().style('display') !== 'none' && e.target().style('display') !== 'none';
    e.style('display', vis ? 'element' : 'none');
  });
}

function toggleTopic(k, div){
  if(hiddenTopics.has(k)){
    hiddenTopics.delete(k);
    div.classList.remove('off');
  } else {
    hiddenTopics.add(k);
    div.classList.add('off');
  }
  const subj = div.dataset.subject;
  if(subj) updateSubjectHeadState(subj);
  applyVisibility();
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  if(!q){ clearSel(); return; }
  clearSel();
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');
  cy.nodes().filter(n => {
    const d = n.data();
    return d.id.toLowerCase().includes(q)
        || (d.full||'').toLowerCase().includes(q)
        || (d.sub||'').toLowerCase().includes(q)
        || (d.subject||'').toLowerCase().includes(q);
  }).forEach(n => {
    n.removeClass('dim').addClass('hl');
    n.neighborhood().edges().removeClass('dim').addClass('hl');
  });
});
</script>
</body>
