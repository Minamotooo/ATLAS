<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arithmetic & Real Numbers — Skill Ontology DAG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f0f2f5;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── top bar ── */
#topbar{background:#1c1c2e;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#topbar h1{font-size:13px;font-weight:600;white-space:nowrap}
#topbar .sep{color:#555;font-size:18px}
#stat{font-size:11px;color:#8a8aaa;white-space:nowrap}
#search{padding:5px 10px;border-radius:5px;border:1px solid #3a3a5c;background:#2a2a44;color:#ddd;font-size:11px;width:190px}
#search::placeholder{color:#666}
.tbtn{background:#2a2a44;border:1px solid #3a3a5c;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap}
.tbtn:hover{background:#3a3a5c}
#layout-label{font-size:10px;color:#666;white-space:nowrap}

/* ── layout ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── left sidebar ── */
#sidebar{width:230px;background:#fff;border-right:1px solid #e0e4ea;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
#sidebar-head{padding:10px 12px 6px;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #eee}
#legend{padding:8px 10px;flex:1}
.leg-item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;user-select:none;transition:background .15s}
.leg-item:hover{background:#f5f7fa}
.leg-item.off{opacity:.35}
.leg-dot{width:13px;height:13px;border-radius:3px;flex-shrink:0;border-width:1.5px;border-style:solid}
.leg-text{font-size:11px;color:#3a3a3a;line-height:1.35;flex:1}
.leg-n{font-size:10px;color:#aaa;margin-left:auto;font-variant-numeric:tabular-nums}
#filter-hint{font-size:10px;color:#bbb;padding:4px 10px 8px;line-height:1.5}

/* ── cy canvas ── */
#cy{flex:1;background:#fafbfc}

/* ── right detail panel ── */
#detail{width:270px;background:#fff;border-left:1px solid #e0e4ea;overflow-y:auto;flex-shrink:0;display:none;position:relative}
#det-inner{padding:14px 14px 20px}
#det-close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:18px;cursor:pointer;color:#bbb;line-height:1}
#det-close:hover{color:#555}
#det-id{font-size:16px;font-weight:700;color:#1c1c2e;margin-bottom:4px}
#det-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;display:inline-block;margin-bottom:10px;border-width:1px;border-style:solid}
#det-sub{font-size:10px;color:#888;margin-bottom:8px;margin-top:-6px}
#det-skill{font-size:12px;color:#333;line-height:1.65;margin-bottom:14px;padding:8px 10px;background:#f8f9fa;border-radius:6px;border-left:3px solid #ccc}
.det-sec{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.dep-list{list-style:none;margin-bottom:14px}
.dep-list li{font-size:11px;color:#444;padding:5px 8px;background:#f8f9fb;border-radius:4px;margin-bottom:3px;cursor:pointer;border-left:3px solid #ddd;line-height:1.4;transition:background .12s}
.dep-list li:hover{background:#eef2ff}
.dep-list li span.dep-id{font-weight:700;margin-right:4px}
.dep-empty{color:#bbb!important;cursor:default!important;border-left-color:#eee!important}

/* ── tooltip ── */
#tip{position:fixed;background:rgba(20,20,35,.88);color:#eee;padding:7px 11px;border-radius:6px;font-size:11px;max-width:270px;line-height:1.55;pointer-events:none;display:none;z-index:9999;box-shadow:0 3px 12px rgba(0,0,0,.3)}
#tip strong{color:#fff;display:block;margin-bottom:2px}

/* ── mini scrollbar ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#f0f2f5}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* ── dark mode ── */
body.dark{background:#12131a}
body.dark #sidebar{background:#1a1b26;border-right-color:#2e2f45}
body.dark #sidebar-head{color:#8a8aaa;border-bottom-color:#2e2f45}
body.dark .leg-text{color:#c0c0d8}
body.dark .leg-n{color:#555}
body.dark #filter-hint{color:#555}
body.dark .leg-item:hover{background:#22233a}
body.dark #cy{background:#12131a}
body.dark #detail{background:#1a1b26;border-left-color:#2e2f45}
body.dark #det-id{color:#e0e0f0}
body.dark #det-sub{color:#666}
body.dark #det-skill{background:#12131a;color:#c0c0d8;border-left-color:#3a3a5c}
body.dark .det-sec{color:#555}
body.dark .dep-list li{background:#12131a;color:#b0b0cc;border-left-color:#3a3a5c}
body.dark .dep-list li:hover{background:#1e1f30}
body.dark .dep-empty{color:#444!important}
body.dark #det-close{color:#555}
body.dark #det-close:hover{color:#aaa}
body.dark ::-webkit-scrollbar-track{background:#12131a}
body.dark ::-webkit-scrollbar-thumb{background:#3a3a5c}

/* ── dark toggle button ── */
#dark-btn{background:#2a2a44;border:1px solid #3a3a5c;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap;line-height:1}
#dark-btn:hover{background:#3a3a5c}
</style>
</head>

<div id="main">

// ─────────────────────────────────────────────
const CROSS_TOPIC = {
  // LG8 (Prime factorization) is the backbone of BOTH HCF-by-prime-factors (T2)
  // AND LCM-by-prime-factorization (T3). It directly unlocks LG11 and LG14.
  'LG8':  ['T2', 'T3'],

  // (LCM ladder method) in T3 — the ladder IS the Euclidean method repurposed.
  'LG12': ['T2', 'T3'],

  // LG16 (HCF of 3+ numbers) is T2, but it feeds LG20 (Product = HCF×LCM)
  // and LG21 (HCF & LCM of fractions) which are T3 skills.
  'LG16': ['T2', 'T3'],

  // LG20 (Product = HCF × LCM) is placed in T3 but it equally
  // represents the relationship between HCF (T2) and LCM (T3).
  'LG20': ['T2', 'T3'],

  // LG21 (HCF & LCM of fractions) straddles both topics —
  // requires HCF of numerators (T2) and LCM of denominators (T3).
  'LG21': ['T2', 'T3'],

  'LG11': ['T2', 'T6'],

  'PC1':  ['T4', 'T5'],

  'PCA3': ['T4', 'T7'],

  'PC6':  ['T4', 'T7'],

// Build a map: skillId → Set of all topic keys it belongs to
const skillTopics = {};
ND.forEach(n => {
  skillTopics[n.id] = new Set([n.tp]);
});
Object.entries(CROSS_TOPIC).forEach(([skillId, topics]) => {
  topics.forEach(tp => {
    if (!skillTopics[skillId]) skillTopics[skillId] = new Set();
    skillTopics[skillId].add(tp);
  });
});

// Build topic → all-skill edges (primary + cross-topic)
const TOPIC_EDGES = [];
Object.keys(T).forEach(k => {
  // All skills whose topic-set includes k
  const allSkills = ND.filter(n => skillTopics[n.id]?.has(k)).map(n => n.id);
  allSkills.forEach(skillId => {
    TOPIC_EDGES.push(['TOPIC_' + k, skillId]);
  });
});

// Update legend counts to reflect cross-topic membership
Object.keys(T).forEach(k => {
  const cnt = ND.filter(n => skillTopics[n.id]?.has(k)).length;
  const el = document.getElementById('leg-n-' + k);
  if (el) el.textContent = cnt;
});

  T3: { label:'3 · LCM',                       bg:'#28180a', bd:'#e67e22', fg:'#f0b27a' },
  T4: { label:'4 · Percentage',                bg:'#2a1010', bd:'#e74c3c', fg:'#f1948a' },
  T5: { label:'5 · Simple & Compound Profit',  bg:'#1e1030', bd:'#9b59b6', fg:'#d2b4de' },
  T6: { label:'6 · Ratio & Proportions',       bg:'#0a2220', bd:'#1abc9c', fg:'#a2d9ce' },
  T7: { label:'7 · Profit & Loss',             bg:'#211a00', bd:'#f1c40f', fg:'#f9e79f' },
};

let isDark = false;

function toggleDark() {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';

  const palette = isDark ? TD : T;
  const edgeCol  = isDark ? '#6e82d4' : '#7a8bbd';
  const hlCol    = isDark ? '#e0e0f0' : '#1c1c2e';

  // Update node colours
  cy.nodes().forEach(n => {
    const p = palette[n.data('tp')] || {};
    n.style({
      'background-color': p.bg || '#222',
      'border-color':     p.bd || '#666',
      'color':            p.fg || '#ccc',
    });
  });

  // Update edge colours
  cy.edges().style({
    'line-color': edgeCol,
    'target-arrow-color': edgeCol,
  });

  // Update hl/sel styles
  cy.style()
    .selector('node.hl').style({ 'border-width':3, 'border-color': hlCol, 'z-index':10 })
    .selector('edge.hl').style({ 'line-color': '#e74c3c',
                                  'target-arrow-color': '#e74c3c',
                                  'width':2.2, 'opacity':1, 'z-index':10 })
    .update();

  // Re-render legend dots
  document.querySelectorAll('.leg-item').forEach(el => {
    const k = el.dataset.k;
    const p = palette[k];
    if (!p) return;
    el.querySelector('.leg-dot').style.background = p.bg;
    el.querySelector('.leg-dot').style.borderColor = p.bd;
  });
}

// ─────────────────────────────────────────────
// PREFIX FULL-FORM MAP
// ─────────────────────────────────────────────
const PREFIX_FULL = {
  'PRE':  'Prerequisite',
  'LG':   'LCM and GCD (HCF)',
  'PC':   'Percentage Concept',
  'PCA':  'Percentage Calculation and Application',
  'SI':   'Simple Interest (Simple Profit)',
  'CI':   'Compound Interest (Compound Profit)',
  'RF':   'Ratio Fundamentals',
  'PF':   'Proportion Fundamentals',
  'TP':   'Types of Proportion',
  'AT':   'Algebraic Transformations of Proportion',
  'PL':   'Profit and Loss',
  'GS':   'Geometry (Similar Figures / Ratios)',
  'TR':   'Trigonometric Ratios',
};

function getPrefixFull(id) {
  // Extract alphabetic prefix (e.g. "PCA" from "PCA3", "PRE" from "PRE10")
  const match = id.match(/^([A-Z]+)/);
  if (!match) return null;
  // Try longest match first (PCA before PC)
  const raw = match[1];
  for (let len = raw.length; len >= 1; len--) {
    const key = raw.substring(0, len);
    if (PREFIX_FULL[key]) return { prefix: key, full: PREFIX_FULL[key] };
  }
  return null;
}

// ─────────────────────────────────────────────
// TOOLTIP
// ─────────────────────────────────────────────
const tip = document.getElementById('tip');
cy.on('mouseover','node', e => {
  const d = e.target.data();
  if (d.isTopic) {
    tip.innerHTML = `<strong>${d.label}</strong><span style="display:block;font-size:10px;color:#aac4ff;margin-top:3px;">Topic node — click for details</span>`;
    tip.style.display = 'block';
    moveTip(e.originalEvent);
    return;
  }
  const pf = getPrefixFull(d.id);
  const pfHtml = pf
    ? `<span style="display:block;font-size:10px;color:#aac4ff;margin-bottom:5px;font-style:italic;">${pf.prefix} = ${pf.full}</span>`
    : '';
  const extras = (d.extraTopics || []).filter(t => T[t]);
  const crossHtml = extras.length
    ? `<span style="display:block;font-size:10px;color:#f0b070;margin-top:5px;">Also in: ${extras.map(t => T[t].label).join(', ')}</span>`
    : '';
  tip.innerHTML = `<strong>${d.id}</strong>${pfHtml}${d.full}${crossHtml}`;
  tip.style.display = 'block';
  moveTip(e.originalEvent);
});
cy.on('mousemove','node', e => moveTip(e.originalEvent));
cy.on('mouseout','node',  () => { tip.style.display='none'; });
function moveTip(ev){
  tip.style.left=(ev.clientX+14)+'px';
  tip.style.top=(ev.clientY+14)+'px';
}

// ─────────────────────────────────────────────
// SELECTION
// ─────────────────────────────────────────────
cy.on('tap','node', e => selectNode(e.target));
cy.on('tap', e => { if(e.target===cy){ clearSel(); closePanel(); } });

function selectNode(n){
  clearSel();
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');
  const nb = n.neighborhood();
  nb.nodes().removeClass('dim').addClass('hl');
  nb.edges().removeClass('dim').addClass('hl');
  n.removeClass('dim').addClass('sel');
  showPanel(n);
}

function clearSel(){
  cy.nodes().removeClass('dim hl sel');
  cy.edges().removeClass('dim hl');
}

// ─────────────────────────────────────────────
// DETAIL PANEL
// ─────────────────────────────────────────────
function showPanel(n){
  const id = n.id();
  const nd = nodeMap[id];
  if (!nd) return;
  const t  = T[nd.tp];

  document.getElementById('det-id').textContent = nd.isTopic ? t.label : id;

  const badge = document.getElementById('det-badge');
  badge.textContent = nd.isTopic ? 'Topic' : t.label;
  badge.style.background = t.bg;
  badge.style.color = t.fg;
  badge.style.borderColor = t.bd;

  // Show extra topic badges for cross-topic skills
  const existingExtras = document.getElementById('det-extra-topics');
  if (existingExtras) existingExtras.remove();
  if (!nd.isTopic) {
    const extras = (nd.extraTopics || []).filter(tk => T[tk]);
    if (extras.length > 0) {
      const extraDiv = document.createElement('div');
      extraDiv.id = 'det-extra-topics';
      extraDiv.style.cssText = 'margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;';
      extras.forEach(tk => {
        const tp = T[tk];
        const span = document.createElement('span');
        span.style.cssText = `font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;border:1px solid ${tp.bd};background:${tp.bg};color:${tp.fg}`;
        span.textContent = 'Also: ' + tp.label;
        extraDiv.appendChild(span);
      });
      badge.insertAdjacentElement('afterend', extraDiv);
    }
  }

  document.getElementById('det-sub').textContent = nd.isTopic ? 'Topic overview' : nd.sub;

  const sk = document.getElementById('det-skill');
  sk.textContent = nd.isTopic ? t.label + ' — click a skill node below for details' : nd.full;
  sk.style.borderLeftColor = t.bd;

  // Prereqs
  const preList = document.getElementById('det-pre');
  preList.innerHTML = '';
  const ins = n.incomers('edge');
  if(ins.length === 0){
    preList.innerHTML = '<li class="dep-empty">None — root skill</li>';
  } else {
    ins.forEach(e => {
      const src = e.source();
      const snd = nodeMap[src.id()];
      if(!snd) return;
      const li = document.createElement('li');
      li.style.borderLeftColor = T[snd.tp]?.bd || '#ddd';
      li.innerHTML = `<span class="dep-id">${src.id()}</span>${snd.full.substring(0,62)}${snd.full.length>62?'…':''}`;
      li.onclick = () => selectNode(src);
      preList.appendChild(li);
    });
  }

  // Leads to
  const outList = document.getElementById('det-out');
  outList.innerHTML = '';
  const outs = n.outgoers('edge');
  if(outs.length === 0){
    outList.innerHTML = '<li class="dep-empty">None — terminal skill</li>';
  } else {
    outs.forEach(e => {
      const tgt = e.target();
      const tnd = nodeMap[tgt.id()];
      if(!tnd) return;
      const li = document.createElement('li');
      li.style.borderLeftColor = T[tnd.tp]?.bd || '#ddd';
      li.innerHTML = `<span class="dep-id">${tgt.id()}</span>${tnd.full.substring(0,62)}${tnd.full.length>62?'…':''}`;
      li.onclick = () => selectNode(tgt);
      outList.appendChild(li);
    });
  }

  document.getElementById('detail').style.display = 'block';
}

function closePanel(){
  document.getElementById('detail').style.display = 'none';
  clearSel();
}

// ─────────────────────────────────────────────
// TOPIC FILTER
// ─────────────────────────────────────────────
const hidden = new Set();
function toggleTopic(k, div){
  if(hidden.has(k)){
    hidden.delete(k);
    div.classList.remove('off');
    // Show topic node + all skill nodes for this topic
    cy.nodes('[tp="'+k+'"]').style('display','element');
    cy.edges().forEach(e => {
      if(e.source().style('display')!=='none' && e.target().style('display')!=='none')
        e.style('display','element');
    });
  } else {
    hidden.add(k);
    div.classList.add('off');
    // Hide topic node + all skill nodes for this topic
    cy.nodes('[tp="'+k+'"]').style('display','none');
    cy.edges().filter(e =>
      e.source().data('tp')===k || e.target().data('tp')===k
    ).style('display','none');
  }
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  if(!q){ clearSel(); return; }
  clearSel();
  cy.nodes().addClass('dim');
  cy.edges().addClass('dim');
  cy.nodes().filter(n => {
    const d = n.data();
    return d.id.toLowerCase().includes(q)
        || (d.full||'').toLowerCase().includes(q)
        || (d.label||'').toLowerCase().includes(q);
  }).forEach(n => {
    n.removeClass('dim').addClass('hl');
    n.neighborhood().edges().removeClass('dim').addClass('hl');
  });
});
</script>
